"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

format = """
[░▒▓](#a3aed2)\
[$time$hostname](bg:#a3aed2 fg:#090c0c)\
[](bg:#212736 fg:#a3aed2)\
$username\
[](bg:#769ff0 fg:#212736)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
$dotnet\
$dart\
$lua\
$docker_context\
[](fg:#212736 bg:#1d2230)\
$battery\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Desktop" = " "
"Videos" = "󰕧 "
"Projects" = "󰲋 "
"Workspace" = "󰖲 "
"Code" = "󰘦 "
"Repos" = "󰳏 "
"Git" = " "
"Config" = " "
".config" = " "
"Home" = " "
"Public" = " "
"Templates" = " "
"tmp" = " "
"Temp" = " "
"Cache" = "󰃨 "
".cache" = "󰃨 "
"Library" = "󰂺 "
"Applications" = "󰀻 "
"include" = " "
"src" = "󰴉 "
"node_modules" = " "
"venv" = "󰌠 "
".venv" = "󰌠 "
"env" = "󰌠 "
"docker" = " "
"kubernetes" = "󱃾 "
"Downloads_old" = " "
"Backup" = "󰁯 "
"Backups" = "󰁯 "
"Notes" = "󱞁 "
"Obsidian" = "󱞁 "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[dotnet]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[dart]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[docker_context]
symbol = " "
style = "bg:#212736"
format = '[[ $symbol $context ](fg:#769ff0 bg:#212736)]($style)'
only_with_files = true

[lua]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[azure]
disabled = false
symbol = "󰠅 "
style = "bg:#212736"
format = '[[ $symbol $subscription ](fg:#769ff0 bg:#212736)]($style)'

[os]
disabled = false
style = "fg:#212736 bg:#a3aed2"

[os.symbols]
Windows = " "
Linux = " "
Fedora = ""
Macos = " "

[battery]
disabled = false

[username]
style_user = "fg:#769ff0 bg:#212736"
style_root = "fg:#ff6e6e bg:#212736"
format = '[[ 󰀄 $user](fg:#769ff0 bg:#212736)]($style_user)'
show_always = true

[hostname]
style = "bg:#a3aed2 fg:#090c0c"
format = '[[ 󰟀 $hostname](fg:#090c0c bg:#a3aed2)]($style)'
ssh_only = false

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[ $time](bg:#a3aed2 fg:#090c0c)]($style)'
